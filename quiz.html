],

{q:"Law of demand says price up, quantity",opts:["Falls","Rises","Constant","Zero"],ans:0},
{q:"Opportunity cost is",opts:["Next best alternative foregone","Money spent","Profit","Loss"],ans:0},

]
};

// === GENERATE SMART QUESTIONS IF NOT IN BANK ===
function smartGenerate(code, n){
  if(TMA_BANK[code]){
    let bank = TMA_BANK[code];
    // shuffle and pick n
    let shuffled = [...bank].sort(()=>0.5-Math.random());
    // if need more than bank, repeat
    while(shuffled.length < n){ shuffled = shuffled.concat(bank); }
    return shuffled.slice(0,n);
  }
  // Fallback - create logical questions from code
  const deptMap = {
    "BIO":"Biology","CHM":"Chemistry","PHY":"Physics","CIT":"Computing","CSS":"Computer Science",
    "MTH":"Mathematics","BUS":"Business","BFN":"Banking & Finance","ECO":"Economics","ACC":"Accounting",
    "ESM":"Environmental Science","PHS":"Physical Sciences","ENG":"English","LIN":"Linguistics",
    "EDU":"Education","LAW":"Law","POL":"Political Science","PUB":"Public Admin"
  };
  let dept = code.replace(/[0-9]/g,'');
  let subject = deptMap[dept] || dept;
  let arr=[];
  const templates=[
    {q:`Which concept is fundamental to ${subject} ${code}?`,opts:[`Core principle of ${subject}`,`Unrelated concept`,`Obsolete theory`,`Myth`],ans:0},
    {q:`In ${code}, what does the term 'system' refer to?`,opts:[`Interrelated parts working together`,`Single isolated part`,`Computer only`,`None`],ans:0},
    {q:`What is the primary focus of ${code} in NOUN curriculum?`,opts:[`Understanding ${subject} fundamentals`,`Entertainment`,`Sports`,`Politics`],ans:0},
    {q:`Which method is used in ${subject} for data analysis?`,opts:[`Scientific method`,`Guessing`,`Mythology`,`Folklore`],ans:0},
    {q:`The importance of ${code} to national development is`,opts:[`Very significant`,`Not important`,`Harmful`,`None`],ans:0}
  ];
  for(let i=0;i<n;i++){
    let t = templates[i % templates.length];
    arr.push({q:`${code} Q${i+1}: ${t.q}`, opts:t.opts, ans:t.ans});
  }
  return arr;
}

// === ALL DEPARTMENTS ===
const nounStructure = {
"Computer Science":{"100":["CIT101","CIT102","MTH101","GST101"],"200":["CIT208","CIT211","CIT215"],"300":["CIT301","CIT309","CIT311"],"400":["CIT411","CIT421","CIT427"],"800":["CIT801"]},
"Biology (BIO)":{"100":["BIO101","BIO102","CHM101"],"200":["BIO201","BIO202"],"300":["BIO301","BIO303"],"400":["BIO401","BIO402"],"800":["BIO801"]},
"Chemistry (CHM)":{"100":["CHM101","CHM102","PHY101"],"200":["CHM201","CHM202"],"300":["CHM301","CHM303"],"400":["CHM401","CHM402"],"800":["CHM801"]},
"Physics (PHY/PHS)":{"100":["PHY101","PHY102","PHS101"],"200":["PHY201","PHY202"],"300":["PHY301","PHY303"],"400":["PHY401","PHY402"],"800":["PHY801"]},
"Business (BUS/BFN)":{"100":["BUS101","BFN101","ACC101"],"200":["BUS202","BFN201"],"300":["BUS301","BFN301"],"400":["BUS401","BFN401"],"800":["BUS727","BFN701"]},
"Economics (ECO)":{"100":["ECO101","ECO102"],"200":["ECO201","ECO202"],"300":["ECO301","ECO303"],"400":["ECO401","ECO402"],"800":["ECO801"]},
"Accounting (ACC)":{"100":["ACC101","ACC102"],"200":["ACC201","ACC202"],"300":["ACC301","ACC303"],"400":["ACC401","ACC402"],"800":["ACC801"]},
"Maths (MTH)":{"100":["MTH101","MTH102"],"200":["MTH201","MTH202"],"300":["MTH301","MTH303"],"400":["MTH401","MTH402"],"800":["MTH801"]},
"Environmental (ESM)":{"100":["ESM101","ESM102"],"200":["ESM201","ESM202"],"300":["ESM301","ESM303"],"400":["ESM401","ESM402"],"800":["ESM801"]},
"GST/ENG/LIN":{"100":["GST101","ENG101","LIN101"],"200":["GST201","ENG201"],"300":["GST301","ENG301"],"400":["ENG401"],"800":["ENG801"]}
};

let selectedDept=Object.keys(nounStructure)[0], selectedLevel='100', selectedCourse=null, currentQuestions=[], current=0, answers={};
const FREE_LIMIT=10;
function getFreeUsed(){return parseInt(localStorage.getItem('free_q_used')||'0')}
function addFreeUsed(n){localStorage.setItem('free_q_used',getFreeUsed()+n)}
function isLoggedIn(){return localStorage.getItem('mrc_logged')==='yes'}

const deptGrid=document.getElementById('deptGrid');
Object.keys(nounStructure).forEach((dept,i)=>{
 let d=document.createElement('div');d.className='pill'+(i===0?' active':'');d.textContent=dept;
 d.onclick=()=>{deptGrid.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));d.classList.add('active');selectedDept=dept;renderCourses();};
 deptGrid.appendChild(d);
});
function setLevel(lvl,el){el.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');selectedLevel=lvl;renderCourses();}
function renderCourses(){
 let grid=document.getElementById('coursesGrid');grid.innerHTML='';
 let codes=nounStructure[selectedDept][selectedLevel]||[];
 codes.forEach(code=>{
   let hasReal = TMA_BANK[code] ? '✅ REAL TMA' : '📚 NOUN SYLLABUS';
   let card=document.createElement('div');card.className='course-card';
   card.innerHTML=`<div style="font-weight:800">${code}</div><div style="font-size:11px;color:#666;margin:4px 0">TMA Past Questions</div><div style="margin-top:6px"><span style="padding:4px 8px;border-radius:100px;font-size:9px;font-weight:800;background:${TMA_BANK[code]?'#0B4D2A':'#E8F5E9'};color:${TMA_BANK[code]?'#fff':'#0B4D2A'}">${hasReal}</span></div><button class="attempt-btn">Attempt ${isLoggedIn()?30:10} Qs →</button>`;
   card.querySelector('.attempt-btn').onclick=()=>handleAttemptClick({code,title:code});card.onclick=()=>handleAttemptClick({code,title:code});grid.appendChild(card);
 });
}
function handleAttemptClick(course){
 window.pendingCourse=course;
 if(!isLoggedIn() && getFreeUsed()>=FREE_LIMIT){openGlobalLogin();return;}
 startCourseAfterLogin(course);
}
function startCourseAfterLogin(course){
 selectedCourse=course;
 let logged=isLoggedIn();let used=getFreeUsed();let remaining=Math.max(0,FREE_LIMIT-used);
 let total = logged ? 30 : Math.min(remaining,10);
 if(total<=0){openGlobalLogin();return;}
 currentQuestions=smartGenerate(course.code,total);
 current=0;answers={};
 document.getElementById('quizBox').style.display='block';document.getElementById('resultBox').style.display='none';document.getElementById('paywallBox').style.display='none';
 document.getElementById('qStatus').textContent=logged?'UNLIMITED':'FREE '+total;loadQ();window.scrollTo(0,350);
}
function loadQ(){
 let q=currentQuestions[current];
 document.getElementById('qCount').textContent=`${selectedCourse.code} - Q${current+1}/${currentQuestions.length}`;
 document.getElementById('bar').style.width=((current+1)/currentQuestions.length*100)+'%';
 document.getElementById('qText').textContent=q.q;
 let optsDiv=document.getElementById('opts');optsDiv.innerHTML='';
 q.opts.forEach((o,i)=>{
   let div=document.createElement('div');div.className='opt'+(answers[current]===i?' selected':'');
   div.innerHTML=`<span style="font-weight:800">${String.fromCharCode(65+i)}</span> <span>${o}</span>`;
   div.onclick=()=>{answers[current]=i;loadQ();};optsDiv.appendChild(div);
 });
}
function nextQ(){if(current<currentQuestions.length-1){current++;loadQ();}else{showResult();}}
function prevQ(){if(current>0){current--;loadQ();}}
function showResult(){
 document.getElementById('quizBox').style.display='none';document.getElementById('resultBox').style.display='block';
 let correct=0;currentQuestions.forEach((q,i)=>{if(answers[i]===q.ans)correct++;});
 if(!isLoggedIn()){addFreeUsed(currentQuestions.length);}
 document.getElementById('scoreBig').textContent=correct+'/'+currentQuestions.length;
 document.getElementById('resultMsg').textContent=`You scored ${correct}/${currentQuestions.length} in ${selectedCourse.code}`;
 document.getElementById('correction').innerHTML=currentQuestions.map((q,i)=>`<div style="padding:10px;border-bottom:1px solid #eee;font-size:12px"><b>Q${i+1}:</b> ${q.q}<br><span style="color:${answers[i]===q.ans?'green':'red'}">Your: ${q.opts[answers[i]]||'No answer'}</span><br><span style="color:green">Correct: ${q.opts[q.ans]}</span></div>`).join('');
}
function continueQuiz(){
 if(!isLoggedIn() && getFreeUsed()>=FREE_LIMIT){
   document.getElementById('resultBox').style.display='none';document.getElementById('paywallBox').style.display='block';document.getElementById('payCourseCode').textContent=selectedCourse.code;
 }else{
   if(isLoggedIn()){startCourseAfterLogin(selectedCourse);}else{renderCourses();document.getElementById('resultBox').style.display='none';}
 }
}
function openGlobalLogin(){document.getElementById('globalLoginModal').classList.add('show');}
function closeGlobalLogin(){document.getElementById('globalLoginModal').classList.remove('show');}
function handleGlobalLogin(){
 let e=document.getElementById('globalEmail').value.trim();let p=document.getElementById('globalPass').value.trim();
 if(!e||p.length<4){let m=document.getElementById('globalLoginMsg');m.style.display='block';m.textContent='Enter valid email & password min 4';return;}
 localStorage.setItem('mrc_logged','yes');localStorage.setItem('mrc_email',e);closeGlobalLogin();
 if(window.pendingCourse)startCourseAfterLogin(window.pendingCourse);
}
renderCourses();
</script>
